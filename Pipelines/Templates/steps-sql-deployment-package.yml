parameters:
  - name: sourceArtifactName
    type: string
    default: 'Dacpac'

  - name: artifactName
    type: string
    default: 'ScriptReport'

  - name: sqlPackagePath
    type: string
    default: ''

  - name: additionalSqlPackageArguments
    type: string
    default: ''

  # Segundos que SqlPackage espera cada consulta contra la base (su default es 60).
  - name: sqlPackageCommandTimeout
    type: number
    default: 60

  - name: prePublishSteps
    type: stepList
    default: []

  - name: allowDataLoss
    type: boolean
    default: false

  - name: dataLossJustification
    type: string
    default: ' '

steps:

  # ==============================================================================
  # SECCION 1: VALIDAR ACEPTACION DE RIESGO
  #   Solo se agrega cuando el pipeline se corre con allowDataLoss = true.
  # ==============================================================================
  - ${{ if eq(parameters.allowDataLoss, true) }}:
    - powershell: |
        $justification = "$env:DATA_LOSS_JUSTIFICATION".Trim()

        if ($justification.Length -lt 10) {
            Write-Host "##vso[task.logissue type=error]Se marcó allowDataLoss, pero falta la justificación (mínimo 10 caracteres)."
            exit 1
        }

        Write-Host "##vso[task.logissue type=warning]Despliegue con posible pérdida de datos permitida. Solicitante: $(Build.RequestedFor). Motivo: $justification"
      displayName: 'Validar aceptación de riesgo'
      env:
        DATA_LOSS_JUSTIFICATION: ${{ parameters.dataLossJustification }}

  # ==============================================================================
  # SECCION 2: DESCARGAR DACPAC
  # ==============================================================================
  - download: current
    artifact: '${{ parameters.sourceArtifactName }}-$(Build.BuildNumber)-$(Build.SourceBranchName)'
    displayName: 'Descargar DACPAC'

  # ==============================================================================
  # SECCION 3: VALIDAR SQLPACKAGE
  # ==============================================================================
  - template: steps-resolve-sqlpackage.yml
    parameters:
      sqlPackagePath: ${{ parameters.sqlPackagePath }}

  # ==============================================================================
  # SECCION 4: VALIDAR DESTINO
  #   Verifica que ConnectionString apunte al mismo servidor y base de datos que
  #   TargetServer y TargetDatabase, que son los que usa el stage de CD.
  # ==============================================================================
  - powershell: |
      $connectionString = $env:TARGET_CONNECTION_STRING
      $targetServer = '$(TargetServer)'
      $targetDatabase = '$(TargetDatabase)'

      $variables = [ordered]@{
          ConnectionString = $connectionString
          TargetServer     = $targetServer
          TargetDatabase   = $targetDatabase
      }

      # Si una variable no existe, Azure DevOps deja el texto literal $(Nombre).
      foreach ($name in $variables.Keys) {
          $value = $variables[$name]

          if ([string]::IsNullOrWhiteSpace($value) -or $value -match '^\$\(.+\)$') {
              Write-Host "##vso[task.logissue type=error]La variable $name no está definida en el variable group."
              exit 1
          }
      }

      try {
          $builder = [System.Data.SqlClient.SqlConnectionStringBuilder]::new($connectionString)
      }
      catch {
          Write-Host "##vso[task.logissue type=error]ConnectionString no tiene un formato válido."
          exit 1
      }

      if ($builder.DataSource -ne $targetServer) {
          Write-Host "##vso[task.logissue type=error]El servidor de ConnectionString ($($builder.DataSource)) no coincide con TargetServer ($targetServer)."
          exit 1
      }

      if ($builder.InitialCatalog -ne $targetDatabase) {
          Write-Host "##vso[task.logissue type=error]La base de ConnectionString ($($builder.InitialCatalog)) no coincide con TargetDatabase ($targetDatabase)."
          exit 1
      }

      Write-Host "Destino validado: $targetServer / $targetDatabase"
    displayName: 'Validar destino'
    env:
      TARGET_CONNECTION_STRING: $(ConnectionString)

  # ==============================================================================
  # SECCION 5: LOCALIZAR DACPAC
  # ==============================================================================
  - powershell: |
      $artifactRoot = "$(Pipeline.Workspace)\${{ parameters.sourceArtifactName }}-$(Build.BuildNumber)-$(Build.SourceBranchName)"

      $metadataPath = Join-Path $artifactRoot 'build-metadata.json'

      if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
          Write-Host "##vso[task.logissue type=error]No se encontró build-metadata.json en: $artifactRoot"
          exit 1
      }

      $buildMetadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json

      # Se usa el DACPAC que registró el CI; los demás .dacpac del artefacto son referencias.
      $dacpacPath = Join-Path $artifactRoot $buildMetadata.dacpacName

      if (-not (Test-Path -LiteralPath $dacpacPath -PathType Leaf)) {
          Write-Host "##vso[task.logissue type=error]No se encontró el DACPAC indicado en la metadata: $dacpacPath"
          exit 1
      }

      $dacpac = Get-Item -LiteralPath $dacpacPath
      $hash = (Get-FileHash -LiteralPath $dacpac.FullName -Algorithm SHA256).Hash

      if ($hash -ne $buildMetadata.sha256) {
          Write-Host "##vso[task.logissue type=error]El hash del DACPAC no coincide con el registrado en el CI."
          exit 1
      }

      Write-Host "DACPAC encontrado:"
      Write-Host $dacpac.FullName

      # Variables SQLCMD que declara el proyecto (las registra el CI).
      $declaredVariables = @($buildMetadata.sqlCmdVariables | Where-Object { $_ }) -join ';'

      Write-Host "##vso[task.setvariable variable=ResolvedDacpacPath]$($dacpac.FullName)"
      Write-Host "##vso[task.setvariable variable=ResolvedDacpacName]$($dacpac.Name)"
      Write-Host "##vso[task.setvariable variable=ResolvedDacpacHash]$hash"
      Write-Host "##vso[task.setvariable variable=SourceArtifactRoot]$artifactRoot"
      Write-Host "##vso[task.setvariable variable=DeclaredSqlCmdVariables]$declaredVariables"
    displayName: 'Localizar DACPAC'

  # ==============================================================================
  # SECCION 6: GENERAR SCRIPT Y DEPLOYMENT REPORT
  #   Las opciones de SqlPackage se guardan en sqlpackage-options.json y el DACPAC
  #   se incluye en el paquete, para que CD pueda repetir la comparación justo
  #   antes de ejecutar y confirmar que el script sigue vigente.
  # ==============================================================================
  - powershell: |
      $sqlPackage = "$(SqlPackagePath)"
      $dacpac = "$(ResolvedDacpacPath)"

      $outputDirectory = "$(Build.ArtifactStagingDirectory)\deployment"

      if (Test-Path $outputDirectory) {
          Remove-Item `
              -Path $outputDirectory `
              -Recurse `
              -Force
      }

      New-Item `
          -Path $outputDirectory `
          -ItemType Directory `
          -Force | Out-Null

      $deploymentScript =
          Join-Path $outputDirectory "DeploymentScript.sql"

      $deploymentReport =
          Join-Path $outputDirectory "DeploymentReport.xml"

      $optionsFile =
          Join-Path $outputDirectory "sqlpackage-options.json"

      # ---------------------------------------------------------------------------
      # Opciones de SqlPackage (las mismas para el reporte, el script y CD)
      # ---------------------------------------------------------------------------

      # BlockOnPossibleDataLoss queda en True salvo que se haya aceptado el riesgo.
      $blockOnPossibleDataLoss = if ($env:ALLOW_DATA_LOSS -eq 'True') { 'False' } else { 'True' }
      Write-Host "BlockOnPossibleDataLoss: $blockOnPossibleDataLoss"

      $options = New-Object System.Collections.Generic.List[string]
      $options.Add("/p:BlockOnPossibleDataLoss=$blockOnPossibleDataLoss")
      $options.Add('/p:VerifyDeployment=True')
      $options.Add('/p:CreateNewDatabase=False')
      $options.Add('/p:ScriptDatabaseOptions=False')
      $options.Add("/p:CommandTimeout=$env:SQLPACKAGE_COMMAND_TIMEOUT")

      # Variables SQLCMD de trazabilidad para deploy.ScriptHistory.
      # Solo se pasan las que declara el proyecto.
      $declaredVariables = @("$(DeclaredSqlCmdVariables)".Split(';') | Where-Object { $_ -and $_ -notmatch '^\$\(' })

      $sqlCmdValues = [ordered]@{
          BuildNumber  = $env:BUILD_NUMBER
          RequestedFor = $env:REQUESTED_FOR
      }

      foreach ($name in $sqlCmdValues.Keys) {
          if ($declaredVariables -contains $name) {
              # Se usa dentro de N'...' en SQL (comilla simple doble) y dentro de
              # :setvar "..." (sin comillas dobles).
              $value = "$($sqlCmdValues[$name])".Replace("'", "''").Replace('"', '')
              $options.Add("/v:$name=$value")
          }
          else {
              Write-Host "##vso[task.logissue type=warning]El proyecto no declara la variable SQLCMD $name; no se registrará en deploy.ScriptHistory."
          }
      }

      # Argumentos adicionales: cada /p: llega a SqlPackage como argumento independiente.
      $additionalArgs = '${{ parameters.additionalSqlPackageArguments }}'
      if (-not [string]::IsNullOrWhiteSpace($additionalArgs)) {
          $options.AddRange([string[]]($additionalArgs.Trim() -split '\s+(?=/)'))
      }

      $optionArgs = $options.ToArray()

      ConvertTo-Json -InputObject $optionArgs |
          Set-Content -LiteralPath $optionsFile -Encoding UTF8

      Write-Host 'Opciones de SqlPackage:'
      $optionArgs | ForEach-Object { Write-Host "  $_" }

      # ---------------------------------------------------------------------------
      # Deployment report
      # ---------------------------------------------------------------------------
      Write-Host "Generando deployment report..."

      & $sqlPackage `
          /Action:DeployReport `
          "/SourceFile:$dacpac" `
          "/TargetConnectionString:$env:TARGET_CONNECTION_STRING" `
          "/OutputPath:$deploymentReport" `
          @optionArgs

      if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]Falló generación del deployment report."
          exit 1
      }

      # Las alertas del reporte se muestran como warnings para quien revisa o aprueba.
      [xml]$report = Get-Content -LiteralPath $deploymentReport -Raw
      $dataLossAlerts = 0

      foreach ($alert in @($report.DeploymentReport.Alerts.Alert | Where-Object { $_ })) {
          foreach ($issue in @($alert.Issue | Where-Object { $_ })) {
              Write-Host "##vso[task.logissue type=warning]$($alert.Name): $($issue.Value)"

              if ($alert.Name -eq 'DataIssue') {
                  $dataLossAlerts++
              }
          }
      }

      if ($dataLossAlerts -gt 0 -and $blockOnPossibleDataLoss -eq 'True') {
          Write-Host "##vso[task.logissue type=warning]Hay $dataLossAlerts alerta(s) de posible pérdida de datos. Si las tablas afectadas tienen registros, el despliegue se detendrá. Para continuar, corre el pipeline manualmente con allowDataLoss y una justificación."
      }

      Write-Host "##vso[task.setvariable variable=DataLossAlerts]$dataLossAlerts"

      # ---------------------------------------------------------------------------
      # Deployment script
      # ---------------------------------------------------------------------------
      Write-Host "Generando deployment script..."

      & $sqlPackage `
          /Action:Script `
          "/SourceFile:$dacpac" `
          "/TargetConnectionString:$env:TARGET_CONNECTION_STRING" `
          "/OutputPath:$deploymentScript" `
          @optionArgs

      if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]Falló generación del deployment script."
          exit 1
      }

      # ---------------------------------------------------------------------------
      # DACPAC al paquete (con sus referencias) para la verificación en CD
      # ---------------------------------------------------------------------------
      $dacpacDirectory = Join-Path $outputDirectory 'dacpac'

      New-Item `
          -Path $dacpacDirectory `
          -ItemType Directory `
          -Force | Out-Null

      Get-ChildItem -LiteralPath "$(SourceArtifactRoot)" -Filter '*.dacpac' -File |
          Copy-Item -Destination $dacpacDirectory

      Write-Host "Script generado:"
      Write-Host $deploymentScript

      Write-Host "Deployment report generado:"
      Write-Host $deploymentReport

      Write-Host "##vso[task.setvariable variable=DeploymentScriptPath]$deploymentScript"
      Write-Host "##vso[task.setvariable variable=DeploymentReportPath]$deploymentReport"
      Write-Host "##vso[task.setvariable variable=DeploymentOptionsPath]$optionsFile"
    displayName: 'Generar Script SQL y Deployment Report'
    env:
      ALLOW_DATA_LOSS: ${{ parameters.allowDataLoss }}
      SQLPACKAGE_COMMAND_TIMEOUT: ${{ parameters.sqlPackageCommandTimeout }}
      TARGET_CONNECTION_STRING: $(ConnectionString)
      BUILD_NUMBER: $(Build.BuildNumber)
      REQUESTED_FOR: $(Build.RequestedFor)

  # ==============================================================================
  # SECCION 7: GENERAR METADATA
  # ==============================================================================
  - powershell: |
      $metadataPath =
          "$(Build.ArtifactStagingDirectory)\deployment\deployment-metadata.json"

      $scriptHash =
          (Get-FileHash `
              -Path "$(DeploymentScriptPath)" `
              -Algorithm SHA256).Hash

      $reportHash =
          (Get-FileHash `
              -Path "$(DeploymentReportPath)" `
              -Algorithm SHA256).Hash

      $metadata = [ordered]@{

          buildId               = "$(Build.BuildId)"
          buildNumber           = "$(Build.BuildNumber)"
          sourceBranch          = "$(Build.SourceBranch)"
          sourceVersion         = "$(Build.SourceVersion)"

          requestedFor          = "$(Build.RequestedFor)"

          dacpacName            = "$(ResolvedDacpacName)"
          dacpacHash            = "$(ResolvedDacpacHash)"

          deploymentScriptHash  = $scriptHash
          deploymentReportHash  = $reportHash

          allowDataLoss         = ($env:ALLOW_DATA_LOSS -eq 'True')
          dataLossJustification = "$env:DATA_LOSS_JUSTIFICATION".Trim()
          dataLossAlerts        = [int]'$(DataLossAlerts)'

          sqlPackageOptions     = (Get-Content -LiteralPath "$(DeploymentOptionsPath)" -Raw | ConvertFrom-Json)

          generatedAtUtc        = [DateTime]::UtcNow.ToString("o")
      }

      $metadata |
          ConvertTo-Json -Depth 5 |
          Set-Content `
              -Path $metadataPath `
              -Encoding UTF8

      Write-Host "Metadata generado:"
      Get-Content $metadataPath

    displayName: 'Generar metadata'
    env:
      ALLOW_DATA_LOSS: ${{ parameters.allowDataLoss }}
      DATA_LOSS_JUSTIFICATION: ${{ parameters.dataLossJustification }}

  # ==============================================================================
  # SECCION 8: STEPS ADICIONALES
  # ==============================================================================
  - ${{ each step in parameters.prePublishSteps }}:
    - ${{ step }}

  # ==============================================================================
  # SECCION 9: PUBLICAR ARTEFACTOS
  # ==============================================================================
  - publish: '$(Build.ArtifactStagingDirectory)\deployment'
    artifact: '${{ parameters.artifactName }}-$(Build.BuildNumber)-$(Build.SourceBranchName)'
    displayName: 'Publicar Deployment Package'

  # ==============================================================================
  # SECCION 10: LIMPIAR DACPAC DEL AGENTE
  # ==============================================================================
  - powershell: |
      $artifactPath = Join-Path `
          '$(Pipeline.Workspace)' `
          '${{ parameters.sourceArtifactName }}-$(Build.BuildNumber)-$(Build.SourceBranchName)'

      Remove-Item `
          -LiteralPath $artifactPath `
          -Recurse `
          -Force `
          -ErrorAction SilentlyContinue
    displayName: 'Limpiar DACPAC'
    condition: always()
