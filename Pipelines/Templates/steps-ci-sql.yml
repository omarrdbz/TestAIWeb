parameters:
  - name: artifactName
    type: string
    default: 'Dacpac'

  - name: sqlProjectPath
    type: string

  - name: dacpacOutputDirectory
    type: string
    default: '$(Build.ArtifactStagingDirectory)\Dacpac'

  - name: buildConfiguration
    type: string
    default: 'Release'

  - name: deploymentFolder
    type: string
    default: 'Deployment'

  - name: prePublishSteps
    type: stepList
    default: []

steps:
  # ==============================================================================
  # SECCIONES 1-4: VALIDAR, COMPILAR Y LOCALIZAR DACPAC (compartido con PR)
  # ==============================================================================
  - template: steps-build-sql.yml
    parameters:
      sqlProjectPath: ${{ parameters.sqlProjectPath }}
      dacpacOutputDirectory: ${{ parameters.dacpacOutputDirectory }}
      buildConfiguration: ${{ parameters.buildConfiguration }}
      deploymentFolder: ${{ parameters.deploymentFolder }}

  # ==============================================================================
  # SECCION 5: GENERAR METADATA
  # ==============================================================================
  - powershell: |
      # Variables SQLCMD que declara el proyecto. El stage de paquete solo pasa
      # /v: para las que existen.
      [xml]$project = Get-Content -LiteralPath "$(ResolvedSqlProjectPath)" -Raw
      $sqlCmdVariables = @(
          $project.SelectNodes("//*[local-name()='SqlCmdVariable']") |
              ForEach-Object { $_.GetAttribute('Include') } |
              Where-Object { $_ }
      )

      $metadata = [ordered]@{
          artifactName       = '${{ parameters.artifactName }}'
          dacpacName         = "$(ResolvedDacpacName)"
          sqlProjectPath     = '${{ parameters.sqlProjectPath }}'
          buildId            = "$(Build.BuildId)"
          buildNumber        = "$(Build.BuildNumber)"
          sourceBranch       = "$(Build.SourceBranch)"
          sourceVersion      = "$(Build.SourceVersion)"
          buildConfiguration = '${{ parameters.buildConfiguration }}'
          sha256             = "$(ResolvedDacpacHash)"
          sqlCmdVariables    = $sqlCmdVariables
          generatedAtUtc     = [DateTime]::UtcNow.ToString('o')
      }

      $metadataPath = Join-Path '${{ parameters.dacpacOutputDirectory }}' 'build-metadata.json'

      $metadata |
          ConvertTo-Json -Depth 5 |
          Set-Content -Path $metadataPath -Encoding UTF8

      Get-Content -LiteralPath $metadataPath
    displayName: 'Generar metadata'

  # ==============================================================================
  # SECCION 6: STEPS ADICIONALES
  # ==============================================================================
  - ${{ each step in parameters.prePublishSteps }}:
    - ${{ step }}

  # ==============================================================================
  # SECCION 7: PUBLICAR DACPAC
  # ==============================================================================
  - publish: '${{ parameters.dacpacOutputDirectory }}'
    artifact: '${{ parameters.artifactName }}-$(Build.BuildNumber)-$(Build.SourceBranchName)'
    displayName: 'Publicar DACPAC'
